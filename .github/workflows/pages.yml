# Checks the game, then publishes it to GitHub Pages. If the check fails, nothing is published and the last good version stays live.
name: Check and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node tools/check.js
      - name: Smoke test (page loads, Duels starts)
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tools/check.js --smoke
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave tooling out of the site
        run: rm -rf .github .githooks tools node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
