# Checks the game, then publishes it to GitHub Pages. If the check fails, nothing is published and the last good version stays live.
# Pinned to ubuntu-24.04 (ubuntu-latest is moving to Ubuntu 26). The browser is installed without --with-deps: the runner image already has
# Chrome's libraries, and the apt step hung for 10 minutes whenever the Ubuntu package mirror was down. Runs queue rather than cancel,
# so the newest push always ends up live.
name: Check and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node tools/check.js
      - name: Smoke test (page loads, Duels starts)
        timeout-minutes: 6
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install chromium
          node tools/check.js --smoke
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave tooling out of the site
        run: rm -rf .github .githooks tools node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
